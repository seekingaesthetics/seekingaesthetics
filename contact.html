<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Seeking Aesthetics</title>
<meta name="description" content="Contact Seeking Aesthetics.">
<link rel="icon" href="logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header id="site-nav"></header>
<main>
<section class="hero"><div class="wrap" style="max-width:720px">
<p class="eyebrow">Contact</p><h1>Say hello.</h1>
<p class="lead">Questions about a listing, partnering, or scholarships? Send a note and we'll get back to you.</p>
<div class="panel" style="margin-top:8px">
<form class="stack" action="https://formspree.io/f/xlgoggve" method="POST">
<input type="hidden" name="_subject" value="Website contact form">
<input type="hidden" name="form_type" value="contact">
<input type="hidden" name="_next" value="https://seekingaesthetics.com/thank-you.html">
<div class="form-row"><div class="input"><label for="n">Name *</label><input id="n" name="name" required></div>
<div class="input"><label for="e">Email *</label><input id="e" type="email" name="email" required></div></div>
<div class="input"><label for="t">I'm a…</label><select id="t" name="contact_type"><option>Student</option><option>School or trainer</option><option>Brand or sponsor</option><option>Other</option></select></div>
<div class="input"><label for="m">Message *</label><textarea id="m" name="message" rows="5" required></textarea></div>
<button class="btn btn-primary" type="submit">Send</button>
</form></div>
<p class="muted" style="margin-top:16px">Or email <a href="mailto:melissasampson@seekingaesthetics.com">melissasampson@seekingaesthetics.com</a></p>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="assets/site.js"></script>

</body>
</html>
